<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiquidLens integration example</title><style>.optical-filter-defs { position: absolute; width: 0; height: 0; }
.optical-stage { position: relative; overflow: hidden; height: 360px;
  border-radius: 24px; isolation: isolate; }
.optical-scene { position: absolute; inset: 0; overflow: hidden;
  background: repeating-linear-gradient(90deg, #b8d3e6 0 30px, #8db9d3 30px 32px); }
.optical-scene h1 { font: 800 80px/1 system-ui; color: #173650; }
.glass { position: absolute; left: 60px; top: 90px; width: 260px;
  height: 100px; border-radius: 32px; isolation: isolate;
  background: #ffffff16; border: 1px solid #fff9; color: #173650;
  box-shadow: inset 0 1px 0 #fffb, 0 0 0 .5px #17365050, 0 8px 24px #17365030; }
.glass-optics { position: absolute; inset: 0; z-index: -1;
  overflow: hidden; border-radius: inherit; pointer-events: none; }
.glass-sampler { position: absolute; inset: 0; overflow: visible; }
.glass-optics::after { content: ""; position: absolute; inset: 0;
  background: var(--glass-tint, #646e8047); pointer-events: none; }
[data-glass-material="clear"] { --glass-tint: #ffffff08; }
[data-glass-enabled="false"] { --glass-tint: transparent; }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  .has-optics { --glass-tint: #e9edf2; }
  .glass-sampler { display: none; }
}
.glass-scene-copy { position: absolute; top: 0; left: 0;
  right: auto; bottom: auto; max-width: none; transform-origin: 0 0; }</style><div class="optical-stage">
  <!-- Decorative scene only: no controls or live inputs. -->
  <div class="optical-scene" aria-hidden="true">
    <h1>MAKE IT FLOW.</h1>
  </div>
  <button class="glass" id="myLens">A new perspective</button>
</div>
<script src="../optics.js?v=20261004-6"></script>
<!-- Add the CSS and JavaScript from the next two tabs. --><script>// Load optics.js first. One map per lens, generated to fit its shape.
const lens = document.querySelector('#myLens');
const scene = document.querySelector('.optical-scene');
const glass = new LiquidGlass(lens, scene, {
  strength: 16,    // Rim displacement in CSS pixels
  blur: 3.2,       // Frosting before refraction
  material: "regular", // Neutral tint; "clear" for optical studies
  dispersion: 0   // Set to 0.02 for subtle edge color separation
});

// After moving a lens (or while it transitions):
glass.invalidate(400);

// After changing the decorative scene's markup:
glass.refreshScene();

// For an unfiltered scene comparison: glass.set({ enabled: false });
// Before removing a lens: glass.destroy();
// The engine samples this explicit scene, not arbitrary page content.
// Keep controls outside the scene; use translate for lens movement.</script></html>
